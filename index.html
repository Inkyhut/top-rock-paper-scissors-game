    <title>Rock Paper Scissors</title>

<body>

    <script>

        // Return one of string values "rock", "paper", "scissors" value in console 

        function getComputerChoice(){
            const comChoice = Math.floor(Math.random()*3);

            if(comChoice === 0){
                return "Rock";
            } else if (comChoice === 1){
                return "Paper";
            } else {
                return "Scissors";
            }

        }

    </script>
